services:

  postgres-container:
    image: postgres:16
    container_name: postgres-container

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${Password}
      POSTGRES_DB: nammastocks

    ports:
      - "5432:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    networks:
      - springboot-postgres-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nammastocks"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  springboot-app:
    build: .
    container_name: springboot-app

    ports:
      - "8085:8080"

    depends_on:
      postgres-container:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-container:5432/nammastocks
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234

    networks:
      - springboot-postgres-network

networks:
  springboot-postgres-network:
    name: springboot-postgres-network
